name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DB_URL:             ${{ secrets.VITE_FIREBASE_DB_URL }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USER_A_NAME:                 ${{ secrets.VITE_USER_A_NAME }}
          VITE_USER_A_PASSWORD:             ${{ secrets.VITE_USER_A_PASSWORD }}
          VITE_USER_A_DBKEY:                ${{ secrets.VITE_USER_A_DBKEY }}
          VITE_USER_A_IMGCOUNT:             ${{ secrets.VITE_USER_A_IMGCOUNT }}
          VITE_USER_B_NAME:                 ${{ secrets.VITE_USER_B_NAME }}
          VITE_USER_B_PASSWORD:             ${{ secrets.VITE_USER_B_PASSWORD }}
          VITE_USER_B_DBKEY:                ${{ secrets.VITE_USER_B_DBKEY }}
          VITE_USER_B_IMGCOUNT:             ${{ secrets.VITE_USER_B_IMGCOUNT }}
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist